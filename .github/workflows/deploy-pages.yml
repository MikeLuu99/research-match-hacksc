name: Deploy Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        env:
          # Production Convex deployment for the built bundle.
          VITE_CONVEX_URL: https://fastidious-sheep-55.convex.cloud
          VITE_CONVEX_SITE_URL: https://fastidious-sheep-55.convex.site
        run: pnpm --filter @workspace/research-match run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy artifacts/research-match/dist/public --project-name=labbe --branch=main
